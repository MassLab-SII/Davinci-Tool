# EGTS exploration config - API-Bank executable world.
#
# Usage:
#   bash scripts/egts/run_apibank.sh

maas:
  default:
    base_url: "${EXPLORATION_MODEL_BASE_URL}"
    api_key: "${EXPLORATION_MODEL_API_KEY}"
    temperature: 0.8
    max_tokens: 100000
  models:
    trajectory_collection:
      model: "${EXPLORATION_MODEL_NAME}"
      base_url: "${EXPLORATION_MODEL_BASE_URL}"
      api_key: "${EXPLORATION_MODEL_API_KEY}"
      temperature: 1.0
      max_tokens: 100000
      thinking: "disabled"
    nl_rewrite:
      model: "${WRITER_MODEL_NAME}"
      base_url: "${WRITER_MODEL_BASE_URL}"
      api_key: "${WRITER_MODEL_API_KEY}"
      temperature: 0.7
      max_tokens: 100000
      thinking: "disabled"
    judge:
      model: "${JUDGE_MODEL_NAME}"
      base_url: "${JUDGE_MODEL_BASE_URL}"
      api_key: "${JUDGE_MODEL_API_KEY}"
      temperature: 0.1
      thinking: "disabled"


execution_mode: "local"

local:
  workspace_root: "./workspaces/apibank"
  cleanup_on_success: true
  cleanup_on_failure: false

docker: {}

stdio_mcp_servers: {}
http_mcp_servers:
  benchmark_env:
    url: "http://127.0.0.1:30001/mcp"
    headers: {}
    timeout: 60
    metadata:
      prompt_domain: "egts"
      output_namespace: "apibank"

executable_world_envs:
  - name: "apibank_world"
    compose_file: "environments/egts/apibank-world/docker-compose.yml"
    project_name: "egts_apibank_{worker_id}"
    healthcheck:
      type: "url"
      value: "http://127.0.0.1:30001/admin/status"
      timeout_s: 120
      interval_s: 2.0
    http_mcp_url: "http://127.0.0.1:30001/mcp"
    http_mcp_headers: {}
    http_timeout_s: 120
    reuse_containers: true
    prompt_domain: "apibank"
    output_namespace: "apibank"
    world_context:
      domain: "API-Bank core and Level-3 executable state spaces"
      operator_role: "multi-domain API assistant"
      observable_state: "episode-local API-Bank JSON databases, local API side-effect state, state hash, and tool call quality metadata"
      reset_semantics: "admin reset selects one API-Bank state space (core or lv3), deep-copies the matching runtime databases, then samples a workflow scenario hint inside that state space"
      exploration_bias:
        - "use ToolSearcher or read-only query APIs to discover useful APIs before mutation"
        - "retrieve authentication tokens before token-protected user data operations"
        - "verify mutations with matching query tools whenever possible"
      success_signals:
        - "read-only calls ground the active API state or tool catalog"
        - "mutation calls change the API-Bank state hash"
        - "follow-up query calls confirm created, updated, or deleted records"
    tool_metadata: {}

pipeline:
  exp_name: "exp_apibank"
  num_iterations: 2000
  num_workers: 1
  output_dir: "./output/exploration_worlds/deepseekv4"
  save_failed: true

trajs2data:
  language: "en"
  max_attempts: 3
  save_filtered: true
  exploration_system_prompt: null
  synthesis_in_collection: false
  replay_synthesis:
    enabled: true
    max_problem_candidates: 3
    max_replay_attempts: 2
    min_quality_tier: "acceptable"
    tool_sequence_selection: "heuristic"
    verify_final_state: true
    save_failed_replays: true
    max_selected_tool_calls: 12
    max_selected_mutations: 10
    harness_mode: "full"
    harness_max_retries_per_step: 2
    harness_model: "trajectory_collection"
    harness_fallback_threshold: 0.5
    preserve_failure_recovery_chains: true
    dependency_relevance_filter: true
    llm_problem_synthesis: true
    max_dependency_distance: 5
    polish_enabled: true
    polish_model: "judge_model"
    enable_quality_judge: true
  task:
    task_type: "executable_world_pool"
    required_servers: ["benchmark_env"]
    primary_server: "benchmark_env"
    prompt_domain: "egts"
    output_namespace: "apibank"
    enabled_task_types:
      - "core"
      - "lv3"
    task_type_selection: "uniform"
    seed_base: null
    max_steps: 20
    n_tools_min: 2
    n_tools_max: 12
    world_context:
      engine: "EGTS"
      exploration_objective: "collect grounded API tool-use trajectories from API-Bank executable worlds for later trajectory-to-problem synthesis"
      evidence_policy: "ground synthesized tasks in observed API responses, token/query evidence, and final API-Bank state evidence"
    read_only_tools:
      - "Calculator"
      - "CheckToken"
      - "DocumentQA"
      - "EmergencyKnowledge"
      - "GetToday"
      - "GetUserToken"
      - "ImageCaption"
      - "PlayMusic"
      - "QueryAgenda"
      - "QueryAlarm"
      - "QueryBalance"
      - "QueryHealthData"
      - "QueryHistoryToday"
      - "QueryMeeting"
      - "QueryRegistration"
      - "QueryReminder"
      - "QueryScene"
      - "QueryStock"
      - "SearchEngine"
      - "SpeechRecognition"
      - "SymptomSearch"
      - "ToolSearcher"
      - "Wiki"
      - "AccountInfo"
      - "ClothingRecommendation"
      - "FlightSearch"
      - "Geocoding"
      - "GetOccupationSalary"
      - "GetWeatherForCoordinates"
      - "HotelAvailability"
      - "LikeCount"
      - "Lv3Calculator"
      - "Lv3QueryMeeting"
      - "Lv3ToolSearcher"
      - "MovieRecommendations"
      - "NearbyRestaurants"
      - "OrganizationMembers"
      - "TaxCalculator"
      - "TravelStatus"
      - "UserMoviePreferences"
      - "UserPosts"
      - "UserWatchedMovies"
    read_only_tools_priority:
      - "ToolSearcher"
      - "GetUserToken"
      - "CheckToken"
      - "SearchEngine"
      - "QueryReminder"
      - "QueryAgenda"
      - "QueryMeeting"
      - "Lv3ToolSearcher"
      - "Geocoding"
      - "GetWeatherForCoordinates"
      - "OrganizationMembers"
      - "UserMoviePreferences"
      - "AccountInfo"
      - "Lv3QueryMeeting"
    tool_metadata: {}

  tool_curriculum:
    selection_strategy: "progressive"
    base_tools:
      - "ToolSearcher"
      - "GetUserToken"
      - "CheckToken"
      - "Calculator"
      - "SearchEngine"
      - "GetToday"
      - "Lv3ToolSearcher"
      - "Geocoding"
      - "Lv3Calculator"
      - "OrganizationMembers"
    anchor_tools:
      - "RegisterUser"
      - "ForgotPassword"
      - "ModifyPassword"
      - "DeleteAccount"
      - "AddAgenda"
      - "ModifyAgenda"
      - "DeleteAgenda"
      - "AddReminder"
      - "ModifyReminder"
      - "DeleteReminder"
      - "AddAlarm"
      - "ModifyAlarm"
      - "DeleteAlarm"
      - "AddMeeting"
      - "ModifyMeeting"
      - "DeleteMeeting"
      - "AppointmentRegistration"
      - "ModifyRegistration"
      - "CancelRegistration"
      - "RecordHealthData"
      - "OpenBankAccount"
      - "BookHotel"
      - "AddScene"
      - "ModifyScene"
      - "DeleteScene"
      - "TimedSwitch"
      - "CancelTimedSwitch"
      - "SendEmail"
      - "PersonalInfoUpdate"
      - "Lv3AddMeeting"
      - "EmailReminder"
      - "FlightSearch"
      - "HotelAvailability"
      - "NearbyRestaurants"
      - "MovieRecommendations"
      - "TravelStatus"
      - "LikeCount"
      - "TaxCalculator"
    stages:
      - name: "stage1_random_tool"
        enabled: true
        weight: 1.0
        description: "Progressive random tool exposure for API-Bank core and Level-3 state spaces"
        difficulty_tiers:
          - tier: "simple"
            weight: 0.15
            tool_count_min: 2
            tool_count_max: 4
            target_n_min: 2
            target_n_max: 5
            min_distinct_tools: 2
            tool_pool: "base_plus_anchor"
            anchor_count: 1
          - tier: "medium"
            weight: 0.35
            tool_count_min: 3
            tool_count_max: 7
            target_n_min: 3
            target_n_max: 9
            min_distinct_tools: 2
            tool_pool: "base_plus_anchor"
            anchor_count: 1
          - tier: "hard"
            weight: 0.30
            tool_count_min: 5
            tool_count_max: 12
            target_n_min: 4
            target_n_max: 15
            min_distinct_tools: 3
            tool_pool: "all"
            anchor_count: 0
      - name: "stage2_skill_guided"
        enabled: true
        weight: 0.20
        description: "Skill-guided API-Bank exploration aligned with the active executable state space"
        n_min: 4
        n_max: 15
        min_distinct_tools: 2

    skill_guided:
      enabled: true
      skills_dir: "src/egts/skills/apibank/{domain}"
      skills_json: "skill_tools.json"
      skills_min: 1
      skills_max: 3
      skill_selection_strategy: "coverage_weighted"
      max_steps_per_skill: 25

    coverage:
      min_success_per_tool: 8
      strategy: "balanced"
      track_file: "coverage.json"
      rebalance_interval: 50

  filters:
    min_steps: 1
    min_changes: 0
    max_changes: 100
    max_failure_rate: 0.5

  deduplication:
    enabled: false

  recoverable:
    enabled: true
    max_failures: 8
    max_failures_per_tool: 4
    max_retries_before_rollback: 3
    enable_filesystem_snapshots: false

  replay_verification:
    enabled: false

  self_questioning:
    enabled: false
    num_candidates: 3
    novelty_weight: 0.6
    coverage_weight: 0.4
    use_embeddings: false

  efficiency_monitor:
    enabled: true
    min_success_rate: 0.1
    window_size: 20
    auto_adjust: true
    reduce_target_n_on_low_rate: true
    target_n_reduction_step: 1
    min_target_n: 1

  hindsight:
    enabled: false
    rewrite_thoughts: false

  data_synthesis:
    max_problem_refine_loops: 3
    max_trajectory_refine_loops: 3
    require_planning_step: true
    require_final_answer: true

  experience_manager:
    enabled: true
    store_path: "experience_store_apibank.json"
    max_skills: 500
    similarity_threshold: 0.85
    retrieve_top_k: 5
    extract_on_success: true
    inject_to_prompt: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "collect_apibank.log"
