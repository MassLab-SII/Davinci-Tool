# EGTS exploration config - AppWorld executable world.
#
# Usage:
#   bash scripts/egts/run_appworld.sh

maas:
  default:
    base_url: "${EXPLORATION_MODEL_BASE_URL}"
    api_key: "${EXPLORATION_MODEL_API_KEY}"
    temperature: 0.8
    max_tokens: 100000
  models:
    trajectory_collection:
      model: "${EXPLORATION_MODEL_NAME}"
      base_url: "${EXPLORATION_MODEL_BASE_URL}"
      api_key: "${EXPLORATION_MODEL_API_KEY}"
      temperature: 1.0
      max_tokens: 100000
      thinking: "disabled"
    nl_rewrite:
      model: "${WRITER_MODEL_NAME}"
      base_url: "${WRITER_MODEL_BASE_URL}"
      api_key: "${WRITER_MODEL_API_KEY}"
      temperature: 0.7
      max_tokens: 100000
      thinking: "disabled"
    judge:
      model: "${JUDGE_MODEL_NAME}"
      base_url: "${JUDGE_MODEL_BASE_URL}"
      api_key: "${JUDGE_MODEL_API_KEY}"
      temperature: 0.1
      thinking: "disabled"


execution_mode: "local"

local:
  workspace_root: "./workspaces/appworld"
  cleanup_on_success: true
  cleanup_on_failure: false

docker: {}

stdio_mcp_servers: {}
http_mcp_servers:
  benchmark_env:
    url: "http://127.0.0.1:30002/mcp"
    headers: {}
    timeout: 180
    metadata:
      prompt_domain: "appworld"
      output_namespace: "appworld"

executable_world_envs:
  - name: "appworld_world"
    compose_file: "environments/egts/appworld-world/docker-compose.yml"
    project_name: "egts_appworld_{worker_id}"
    healthcheck:
      type: "url"
      value: "http://127.0.0.1:30002/admin/status"
      timeout_s: 180
      interval_s: 2.0
    http_mcp_url: "http://127.0.0.1:30002/mcp"
    http_mcp_headers: {}
    http_timeout_s: 180
    reuse_containers: true
    prompt_domain: "appworld"
    output_namespace: "appworld"
    world_context:
      domain: "AppWorld day-to-day app ecosystem"
      tool_surface: "egts_meta_tools_over_appworld_apis"
      operator_role: "multi-app API assistant using a compact AppWorld API discovery/call wrapper"
      observable_state: "episode-local AppWorld task, app API schemas, app database hashes, meta-tool call trace, task completion, and evaluator metadata"
      reset_semantics: "admin reset samples or loads one AppWorld task, initializes task-specific app databases and datetime, and binds the AppWorld runtime to the hidden world session"
      exploration_bias:
        - "read the active task and available apps before choosing APIs"
        - "search and inspect API schemas before calling APIs"
        - "authenticate or obtain tokens when APIs require them"
        - "perform useful app operations and verify results with follow-up read APIs"
      success_signals:
        - "schema-grounded AppWorld API calls succeed"
        - "state-changing APIs alter the AppWorld database hash when appropriate"
        - "follow-up calls verify created, updated, or deleted app records"
        - "admin verify reports task completion or useful state evidence"
    tool_metadata: {}

pipeline:
  exp_name: "exp_appworld"
  num_iterations: 2000
  num_workers: 1
  output_dir: "./output/exploration_worlds/deepseekv4"
  save_failed: true

trajs2data:
  language: "en"
  max_attempts: 3
  save_filtered: true
  exploration_system_prompt: null
  synthesis_in_collection: false
  replay_synthesis:
    enabled: true
    max_problem_candidates: 3
    max_replay_attempts: 2
    min_quality_tier: "acceptable"
    tool_sequence_selection: "heuristic"
    verify_final_state: true
    save_failed_replays: true
    max_selected_tool_calls: 12
    max_selected_mutations: 10
    harness_mode: "full"
    harness_max_retries_per_step: 2
    harness_model: "trajectory_collection"
    harness_fallback_threshold: 0.5
    preserve_failure_recovery_chains: true
    dependency_relevance_filter: true
    llm_problem_synthesis: true
    max_dependency_distance: 5
    polish_enabled: true
    polish_model: "judge_model"
    enable_quality_judge: true
  task:
    task_type: "executable_world_pool"
    required_servers: ["benchmark_env"]
    primary_server: "benchmark_env"
    prompt_domain: "egts"
    output_namespace: "appworld"
    enabled_task_types:
      - "train"
    task_type_selection: "uniform"
    seed_base: null
    max_steps: 24
    n_tools_min: 6
    n_tools_max: 6
    world_context:
      engine: "EGTS"
      world_domain: "appworld.apps"
      retrieval_only_world: false
      tool_surface: "egts_meta_tools_over_appworld_apis"
      exploration_objective: "collect grounded AppWorld multi-app API discovery, schema inspection, authentication, mutation, and verification trajectories"
      evidence_policy: "ground synthesized tasks in the active AppWorld instruction, observed API schemas, app API responses, state hashes, and call-trace verification"
    read_only_tools:
      - "get_current_task"
      - "list_appworld_apis"
      - "search_appworld_apis"
      - "get_appworld_api_schema"
      - "get_call_trace"
    read_only_tools_priority:
      - "get_current_task"
      - "search_appworld_apis"
      - "get_appworld_api_schema"
      - "get_call_trace"
    tool_metadata: {}

  tool_curriculum:
    selection_strategy: "progressive"
    base_tools:
      - "get_current_task"
      - "list_appworld_apis"
      - "search_appworld_apis"
      - "get_appworld_api_schema"
    anchor_tools:
      - "call_appworld_api"
      - "get_call_trace"
    stages:
      - name: "stage1_random_tool"
        enabled: true
        weight: 0.5
        description: "Progressively expose AppWorld task, API discovery, schema, call, and trace tools"
        difficulty_tiers:
          - tier: "simple"
            weight: 0.3
            tool_count_min: 6
            tool_count_max: 6
            target_n_min: 3
            target_n_max: 5
            min_distinct_tools: 3
            tool_pool: "base_plus_anchor"
            anchor_count: 2
          - tier: "medium"
            weight: 0.4
            tool_count_min: 6
            tool_count_max: 6
            target_n_min: 4
            target_n_max: 6
            min_distinct_tools: 3
            tool_pool: "base_plus_anchor"
            anchor_count: 2
          - tier: "hard"
            weight: 0.3
            tool_count_min: 6
            tool_count_max: 6
            target_n_min: 5
            target_n_max: 8
            min_distinct_tools: 4
            tool_pool: "base_plus_anchor"
            anchor_count: 2
      - name: "stage2_skill_guided"
        enabled: true
        weight: 0.5
        description: "Professional AppWorld multi-app workflow exploration"
        n_min: 4
        n_max: 8
        min_distinct_tools: 3

    skill_guided:
      enabled: true
      skills_dir: "src/egts/skills/appworld"
      skills_json: "skill_tools.json"
      skills_min: 1
      skills_max: 2
      skill_selection_strategy: "coverage_weighted"
      max_steps_per_skill: 30

    coverage:
      min_success_per_tool: 8
      strategy: "balanced"
      track_file: "coverage.json"
      rebalance_interval: 50

  filters:
    min_steps: 1
    min_changes: 0
    max_changes: 100
    max_failure_rate: 0.5

  deduplication:
    enabled: false

  recoverable:
    enabled: true
    max_failures: 8
    max_failures_per_tool: 4
    max_retries_before_rollback: 3
    enable_filesystem_snapshots: false

  replay_verification:
    enabled: false

  self_questioning:
    enabled: false
    num_candidates: 3
    novelty_weight: 0.6
    coverage_weight: 0.4
    use_embeddings: false

  efficiency_monitor:
    enabled: true
    min_success_rate: 0.1
    window_size: 20
    auto_adjust: true
    reduce_target_n_on_low_rate: true
    target_n_reduction_step: 1
    min_target_n: 1

  hindsight:
    enabled: false
    rewrite_thoughts: false

  data_synthesis:
    max_problem_refine_loops: 3
    max_trajectory_refine_loops: 3
    require_planning_step: true
    require_final_answer: true

  experience_manager:
    enabled: true
    store_path: "experience_store_appworld.json"
    max_skills: 500
    similarity_threshold: 0.85
    retrieve_top_k: 5
    extract_on_success: true
    inject_to_prompt: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
