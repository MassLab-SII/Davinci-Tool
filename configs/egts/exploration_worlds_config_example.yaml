# EGTS exploration config example for a pool of executable worlds.
#
# Usage:
#   PYTHONPATH=src/egts python -m data_collection.main --config configs/egts/exploration_worlds_config_example.yaml
#
# Design intent:
#   - Use ONE unified prompt set under prompts/.
#   - Put shared exploration semantics in trajs2data.task.world_context.
#   - Put per-world semantics in executable_world_envs[*].world_context.
#   - The runtime treats executable_world_envs as an episode-level world pool.
#     For each episode it selects one world by round-robin:
#       selected_index = (iteration + worker_id) % len(executable_world_envs)
#     This is not a "run every world once, then synthesize" batch orchestrator.
#     It is a collection-time sampler over available executable worlds.

maas:
  default:
    base_url: "${EXPLORATION_MODEL_BASE_URL}"
    api_key: "${EXPLORATION_MODEL_API_KEY}"
    temperature: 0.8
    max_tokens: 100000
  models:
    trajectory_collection:
      model: "${EXPLORATION_MODEL_NAME}"
      base_url: "${EXPLORATION_MODEL_BASE_URL}"
      api_key: "${EXPLORATION_MODEL_API_KEY}"
      temperature: 1.0
      max_tokens: 100000
      thinking: "disabled"
    nl_rewrite:
      model: "${WRITER_MODEL_NAME}"
      base_url: "${WRITER_MODEL_BASE_URL}"
      api_key: "${WRITER_MODEL_API_KEY}"
      temperature: 0.7
      max_tokens: 100000

execution_mode: "local"

local:
  workspace_root: "./workspaces/executable_worlds"
  cleanup_on_success: true
  cleanup_on_failure: false

docker: {}

stdio_mcp_servers: {}
http_mcp_servers: {}

executable_world_envs:
  - name: "tool_sandbox_world"
    compose_file: "environments/egts/tool-sandbox-world/docker-compose.yml"
    project_name: "egts_tool_sandbox_world"
    healthcheck:
      type: "url"
      value: "http://127.0.0.1:30017/admin/status"
      timeout_s: 120
      interval_s: 2.0
    reset_command: "curl -fsS -X POST http://127.0.0.1:30017/admin/reset"
    http_mcp_url: "http://127.0.0.1:30017/mcp"
    http_mcp_headers: {}
    http_timeout_s: 120
    reuse_containers: true
    prompt_domain: "egts"
    output_namespace: "tool-sandbox"
    world_context:
      domain: "personal device services"
      operator_role: "on-device assistant"
      observable_state: "contacts, messages, reminders, and device settings exposed by tools"
      exploration_bias:
        - "inspect current contact, message, or reminder state before taking actions"
        - "prefer realistic personal-assistant workflows"
      success_signals:
        - "tool outputs show the requested records were inspected"
        - "mutations are verified by a follow-up read when possible"
    tool_metadata: {}

pipeline:
  exp_name: "egts_executable_worlds_example"
  num_iterations: 20
  num_workers: 2
  output_dir: "./output/executable_worlds"
  save_failed: true

trajs2data:
  language: "en"
  max_attempts: 3
  save_filtered: true
  exploration_system_prompt: null

  # Recommended EGTS mode: collect grounded raw trajectories first, then run
  # configs/egts/data_synthesis_example.yaml through data_synthesis/pipeline.py.
  synthesis_in_collection: false

  task:
    task_type: "executable_world_pool"
    required_servers: ["benchmark_env"]
    primary_server: "benchmark_env"
    prompt_domain: "egts"
    output_namespace: "executable_world_pool"
    seed_base: null
    max_steps: 20
    n_tools_min: 2
    n_tools_max: 12

    # Shared context applied to every world in the pool. The selected
    # executable_world_envs[*].world_context is merged into this per episode.
    world_context:
      engine: "EGTS"
      exploration_objective: "collect grounded trajectories from executable worlds for later trajectory-to-problem synthesis"
      prompt_policy: "use the unified prompts package; do not rely on world-specific prompt files"
      evidence_policy: "every synthesized task should be grounded in observed tool outputs and final state evidence"

    read_only_tools: []
    read_only_tools_priority: []
    tool_metadata: {}

  tool_curriculum:
    selection_strategy: "progressive"
    base_tools: []
    anchor_tools: null
    stages:
      - name: "stage1_random_tool"
        enabled: true
        weight: 1.0
        description: "Progressive random tool exposure for breadth and difficulty growth"
        difficulty_tiers:
          - tier: "simple"
            weight: 0.3
            tool_count_min: 2
            tool_count_max: 4
            target_n_min: 1
            target_n_max: 3
            min_distinct_tools: 1
            tool_pool: "base_only"
            anchor_count: 0
          - tier: "medium"
            weight: 0.4
            tool_count_min: 3
            tool_count_max: 6
            target_n_min: 2
            target_n_max: 6
            min_distinct_tools: 2
            tool_pool: "base_plus_anchor"
            anchor_count: 1
          - tier: "hard"
            weight: 0.3
            tool_count_min: 5
            tool_count_max: 12
            target_n_min: 3
            target_n_max: 10
            min_distinct_tools: 3
            tool_pool: "all"
            anchor_count: 0
      - name: "stage2_skill_guided"
        enabled: false
        weight: 1.0
        description: "Optional deeper exploration after world skills are curated"
        n_min: 4
        n_max: 15
        min_distinct_tools: 2

    skill_guided:
      enabled: false
      skills_dir: "src/egts/skills/{domain}"
      skills_json: "skill_tools.json"
      skills_min: 1
      skills_max: 3
      skill_selection_strategy: "coverage_weighted"
      max_steps_per_skill: 25

    coverage:
      min_success_per_tool: 10
      strategy: "balanced"
      track_file: "coverage.json"
      rebalance_interval: 50

  filters:
    min_steps: 1
    min_changes: 0
    max_changes: 100
    max_failure_rate: 0.5

  deduplication:
    enabled: false

  recoverable:
    enabled: true
    max_failures: 8
    max_failures_per_tool: 4
    max_retries_before_rollback: 3
    enable_filesystem_snapshots: false

  replay_verification:
    enabled: false

  self_questioning:
    # Collection-only mode should focus on grounded exploration and raw evidence.
    # Candidate problem generation belongs in configs/egts/data_synthesis_example.yaml.
    enabled: false
    num_candidates: 3
    novelty_weight: 0.6
    coverage_weight: 0.4
    use_embeddings: false

  efficiency_monitor:
    enabled: true
    min_success_rate: 0.1
    window_size: 20
    auto_adjust: true
    reduce_target_n_on_low_rate: true
    target_n_reduction_step: 1
    min_target_n: 1

  hindsight:
    enabled: true
    rewrite_thoughts: true

  data_synthesis:
    max_problem_refine_loops: 3
    max_trajectory_refine_loops: 3
    require_planning_step: true
    require_final_answer: true

  experience_manager:
    enabled: true
    store_path: "experience_store.json"
    max_skills: 500
    similarity_threshold: 0.85
    retrieve_top_k: 5
    extract_on_success: true
    inject_to_prompt: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "collect.log"
