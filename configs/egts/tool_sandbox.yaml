# EGTS Configuration — ToolSandbox Executable World
#
# Usage:
#   PYTHONPATH=src/egts python src/egts/data_collection/main.py --config configs/egts/tool_sandbox.yaml
#
# Design intent:
#   - In-memory device/contact/messaging/reminder world with 27 tools across 30 tasks.
#   - Collection-only EGTS config: collect grounded raw trajectories first.
#   - Uses the unified prompts/ package; ToolSandbox world context enters through
#     task.world_context, server reset metadata, tool schemas, and state evidence.

maas:
  default:
    base_url: "${EXPLORATION_MODEL_BASE_URL}"
    api_key: "${EXPLORATION_MODEL_API_KEY}"
    temperature: 0.8
    max_tokens: 100000
  models:
    trajectory_collection:
      model: "${EXPLORATION_MODEL_NAME}"
      base_url: "${EXPLORATION_MODEL_BASE_URL}"
      api_key: "${EXPLORATION_MODEL_API_KEY}"
      temperature: 1.0
      thinking: "disabled"
    nl_rewrite:
      model: "${WRITER_MODEL_NAME}"
      base_url: "${WRITER_MODEL_BASE_URL}"
      api_key: "${WRITER_MODEL_API_KEY}"
      temperature: 0.7
      thinking: "disabled"
    judge:
      model: "${JUDGE_MODEL_NAME}"
      base_url: "${JUDGE_MODEL_BASE_URL}"
      api_key: "${JUDGE_MODEL_API_KEY}"
      temperature: 0.1
      thinking: "disabled"

execution_mode: "local"

local:
  workspace_root: "./workspaces-tool-sandbox"
  cleanup_on_success: true
  cleanup_on_failure: false

docker: {}

http_mcp_servers:
  tool_sandbox_world:
    url: "http://127.0.0.1:30017/mcp"
    headers: {}
    timeout: 60
    metadata:
      prompt_domain: "tool-sandbox"
      output_namespace: "tool-sandbox"

stdio_mcp_servers: {}

pipeline:
  exp_name: "exp_tool_sandbox_e2e_p0fix"
  num_iterations: 50
  num_workers: 1
  output_dir: "./output/replay_synthesis_e2e"
  save_failed: true

trajs2data:
  language: "en"
  max_attempts: 3
  save_filtered: true
  exploration_system_prompt: null
  synthesis_in_collection: false
  replay_synthesis:
    enabled: true
    max_problem_candidates: 3
    max_replay_attempts: 2
    min_quality_tier: "acceptable"
    tool_sequence_selection: "universal"
    verify_final_state: true
    save_failed_replays: true
    max_selected_tool_calls: 12
    max_selected_mutations: 10
    harness_mode: "full"
    harness_max_retries_per_step: 2
    harness_model: "trajectory_collection"
    harness_fallback_threshold: 0.5
    preserve_failure_recovery_chains: true
    dependency_relevance_filter: true
    llm_problem_synthesis: true
    max_dependency_distance: 5
    polish_enabled: true
    polish_model: "judge_model"
    enable_quality_judge: true

  task:
    task_type: "tool_sandbox"
    required_servers: ["tool_sandbox_world"]
    primary_server: "tool_sandbox_world"
    prompt_domain: "tool-sandbox"
    output_namespace: "tool-sandbox"

    max_steps: 25
    n_tools_min: 3
    n_tools_max: 27

    world_context:
      engine: "EGTS"
      domain: "ToolSandbox device/contact/messaging/reminder executable world"
      exploration_objective: "collect grounded multi-domain tool-calling trajectories across contact management, device settings, messaging, reminder scheduling, time arithmetic, and cross-domain workflows"
      operator_role: "virtual assistant agent"
      observable_state: "contacts, device settings (cellular, wifi, location), messages, reminders, and current time exposed by tools"
      evidence_policy: "inspect state before action and verify meaningful mutations (state hash changes, entity count changes) when possible"

    read_only_tools: []
    read_only_tools_priority: []
    tool_metadata: {}

  tool_curriculum:
    selection_strategy: "progressive"

    base_tools: []
    anchor_tools: null

    stages:
      - name: "stage1_random_tool"
        enabled: true
        weight: 0.70
        description: "Random tool exposure breadth exploration"
        difficulty_tiers:
          - tier: "simple"
            weight: 0.10
            tool_count_min: 3
            tool_count_max: 5
            target_n_min: 3
            target_n_max: 5
            min_distinct_tools: 2
            tool_pool: "base_only"
            anchor_count: 0
          - tier: "medium"
            weight: 0.25
            tool_count_min: 5
            tool_count_max: 10
            target_n_min: 4
            target_n_max: 10
            min_distinct_tools: 3
            tool_pool: "base_plus_anchor"
            anchor_count: 1
          - tier: "hard"
            weight: 0.35
            tool_count_min: 8
            tool_count_max: 20
            target_n_min: 6
            target_n_max: 15
            min_distinct_tools: 4
            tool_pool: "all"
            anchor_count: 0

      - name: "stage2_skill_guided"
        enabled: true
        weight: 0.30
        description: "Skill-guided deep exploration"
        n_min: 4
        n_max: 15
        min_distinct_tools: 2

    skill_guided:
      enabled: true
      skills_dir: "src/egts/skills/tool-sandbox"
      skills_json: "skill_tools.json"
      skills_min: 1
      skills_max: 3
      skill_selection_strategy: "coverage_weighted"
      max_steps_per_skill: 25

    coverage:
      min_success_per_tool: 10
      strategy: "balanced"
      track_file: "coverage.json"
      rebalance_interval: 50

  filters:
    min_steps: 1
    min_changes: 0
    max_changes: 100

  deduplication:
    enabled: false

  recoverable:
    enabled: true
    max_failures: 8
    max_failures_per_tool: 4
    max_retries_before_rollback: 3
    enable_filesystem_snapshots: false

  replay_verification:
    enabled: false

  self_questioning:
    enabled: false
    num_candidates: 3
    novelty_weight: 0.6
    coverage_weight: 0.4
    use_embeddings: false

  efficiency_monitor:
    enabled: true
    min_success_rate: 0.1
    window_size: 20
    auto_adjust: true
    reduce_target_n_on_low_rate: true
    target_n_reduction_step: 1
    min_target_n: 1

  hindsight:
    enabled: false
    rewrite_thoughts: false

  data_synthesis:
    max_problem_refine_loops: 3
    max_trajectory_refine_loops: 3
    require_planning_step: true
    require_final_answer: true

  experience_manager:
    enabled: true
    store_path: "experience_store_tool_sandbox.json"
    max_skills: 500
    similarity_threshold: 0.85
    retrieve_top_k: 5
    extract_on_success: true
    inject_to_prompt: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "collect_tool_sandbox_e2e_p0fix.log"
